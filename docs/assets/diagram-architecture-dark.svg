<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Precedent architecture</title><desc id="d">A progressive web app talks to the Precedent API over REST and live server-sent events. The API holds the 3-way match, hard controls, recommender, autonomy, compliance, anomaly model and capture, with SQLite as the system of record. It uses Hindsight Cloud for memory, an LLM failover chain for decisions and Gemini vision for invoice photos.</desc>
