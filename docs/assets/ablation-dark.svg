<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Precedent ablation study</title>
<desc id="d">Accuracy, wrong payments, cost and latency of six ways to use past decisions, measured on the same cases with the same memory and the same LLM.</desc>
<rect x="0.5" y="0.5" width="999" height="451" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="28" y="36" font-size="15" font-weight="600" fill="#ffffff">Which part of memory does the work? Same cases, same memory, same LLM</text>
<text x="28" y="57" font-size="12.5" fill="#c3c2b7">Judgement exceptions in weeks 5–12 of a 12-week replay (36 cases, after a month of learning) · only the retrieval differs</text>
<text x="300" y="92" font-size="11.5" text-anchor="start" fill="#898781">Matches the clerk</text>
<text x="740" y="92" font-size="11.5" text-anchor="end" fill="#898781">Wrong pays</text>
<text x="850" y="92" font-size="11.5" text-anchor="end" fill="#898781">Cost / case</text>
<text x="962" y="92" font-size="11.5" text-anchor="end" fill="#898781">p50 latency</text>
