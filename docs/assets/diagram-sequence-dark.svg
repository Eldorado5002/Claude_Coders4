<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The learning loop, step by step</title><desc id="d">Numbered sequence between the invoice, the Precedent API, Hindsight and the AP clerk: reflect for a cited recommendation, the clerk decides, the autonomy ladder updates, and the lesson is retained.</desc>
