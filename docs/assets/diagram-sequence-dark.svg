<rect x="0.5" y="0.5" width="959" height="499" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="30" y="26" width="160" height="44" rx="10" fill="#232322" stroke="#3d3d3a" stroke-width="1.2"/>
