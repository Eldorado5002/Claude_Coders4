<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How an invoice flows through Precedent</title><desc id="d">Invoice in, 3-way match (clean invoices are paid), hard controls (fired controls go to reject or escalate), Hindsight memory (a recall fast path for routine cases, reflect otherwise) plus an anomaly check, earned autonomy decides between auto-resolve and the clerk, and every decision is retained in Hindsight, which feeds the next recommendation.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d7c76"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="24" y="152" width="160" height="122" rx="10" fill="#232322" stroke="#3d3d3a" stroke-width="1.2"/>
<text x="104.0" y="191.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">Invoice in</text>
<text x="104.0" y="213.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">ERP feed, or a photo</text>
<text x="104.0" y="231.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">or PDF read by</text>
<text x="104.0" y="249.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">Gemini vision</text>
<circle cx="26" cy="154" r="12" fill="#3987e5" stroke="#1a1a19" stroke-width="3"/>
<text x="26" y="158.5" font-size="12.5" font-weight="700" fill="#1a1a19" text-anchor="middle">1</text>
<rect x="212" y="152" width="160" height="122" rx="10" fill="#232322" stroke="#3d3d3a" stroke-width="1.2"/>
<text x="292.0" y="191.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">3-way match</text>
<text x="292.0" y="213.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">every line checked</text>
<text x="292.0" y="231.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">against the PO and</text>
<text x="292.0" y="249.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">goods receipt</text>
<circle cx="214" cy="154" r="12" fill="#3987e5" stroke="#1a1a19" stroke-width="3"/>
<text x="214" y="158.5" font-size="12.5" font-weight="700" fill="#1a1a19" text-anchor="middle">2</text>
<path d="M187,213.0 L209,213.0" fill="none" stroke="#7d7c76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="400" y="152" width="160" height="122" rx="10" fill="#232322" stroke="#3d3d3a" stroke-width="1.2"/>
<text x="480.0" y="191.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">Hard controls</text>
<text x="480.0" y="213.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">duplicate · bank change</text>
<text x="480.0" y="231.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">GSTIN · e-invoice IRN</text>
<text x="480.0" y="249.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">new vendor · over ₹5L</text>
<circle cx="402" cy="154" r="12" fill="#3987e5" stroke="#1a1a19" stroke-width="3"/>
<text x="402" y="158.5" font-size="12.5" font-weight="700" fill="#1a1a19" text-anchor="middle">3</text>
<path d="M375,213.0 L397,213.0" fill="none" stroke="#7d7c76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="588" y="152" width="160" height="122" rx="10" fill="#15263b" stroke="#3987e5" stroke-width="2"/>
<text x="668.0" y="191.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">Hindsight memory</text>
<text x="668.0" y="213.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">routine: recall</text>
<text x="668.0" y="231.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">fast path · else reflect</text>
<text x="668.0" y="249.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">+ anomaly check</text>
<circle cx="590" cy="154" r="12" fill="#3987e5" stroke="#1a1a19" stroke-width="3"/>
<text x="590" y="158.5" font-size="12.5" font-weight="700" fill="#1a1a19" text-anchor="middle">4</text>
<path d="M563,213.0 L585,213.0" fill="none" stroke="#7d7c76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="776" y="152" width="160" height="122" rx="10" fill="#232322" stroke="#3d3d3a" stroke-width="1.2"/>
<text x="856.0" y="191.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">Earned autonomy?</text>
<text x="856.0" y="213.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">yes: auto-resolve</text>
<text x="856.0" y="231.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">no: clerk decides,</text>
<text x="856.0" y="249.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">with cited proof</text>
<circle cx="778" cy="154" r="12" fill="#3987e5" stroke="#1a1a19" stroke-width="3"/>
<text x="778" y="158.5" font-size="12.5" font-weight="700" fill="#1a1a19" text-anchor="middle">5</text>
<path d="M751,213.0 L773,213.0" fill="none" stroke="#7d7c76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="208" y="26" width="168" height="70" rx="10" fill="#13261a" stroke="#3fb950" stroke-width="2"/>
<text x="292.0" y="57.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">Paid</text>
<text x="292.0" y="79.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">everything matches</text>
<path d="M292.0,149 L292.0,100" fill="none" stroke="#7d7c76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="300.0" y="130" font-size="13" font-weight="400" fill="#b3b2ab" text-anchor="start">clean</text>
<rect x="396" y="26" width="168" height="70" rx="10" fill="#2e1716" stroke="#f85149" stroke-width="2"/>
<text x="480.0" y="57.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">Reject or escalate</text>
<text x="480.0" y="79.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">always goes to a human</text>
<path d="M480.0,149 L480.0,100" fill="none" stroke="#7d7c76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="488.0" y="130" font-size="13" font-weight="400" fill="#b3b2ab" text-anchor="start">control fires</text>
<rect x="584" y="340" width="356" height="74" rx="10" fill="#15263b" stroke="#3987e5" stroke-width="2"/>
<text x="762.0" y="364.0" font-size="16" font-weight="600" fill="#f0f0ee" text-anchor="middle">Hindsight retain</text>
<text x="762.0" y="386.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">the lesson is stored: personal data redacted,</text>
<text x="762.0" y="404.0" font-size="13.5" font-weight="400" fill="#b3b2ab" text-anchor="middle">attributed and tagged</text>
<path d="M856.0,277 L856.0,336" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<path d="M668.0,337 L668.0,281" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="658.0" y="306" font-size="13" font-weight="400" fill="#3987e5" text-anchor="end">memory feeds</text>
<text x="658.0" y="323" font-size="13" font-weight="400" fill="#3987e5" text-anchor="end">the next decision</text>
<text x="846.0" y="316" font-size="13" font-weight="400" fill="#3987e5" text-anchor="end">every decision</text>
<text x="24" y="448" font-size="13" font-weight="400" fill="#b3b2ab" text-anchor="start">Controls run in plain code before any AI. Memory can recommend, but it can never override them.</text>
</svg>
